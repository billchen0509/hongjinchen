    Experience:
      - company: McGill University
        position: Graduate Research Trainee
        location: Montreal, Canada
        start_date: 2025-05
        end_date: 2025-09
        summary: "Supervisor: Dr. Matthias Klein"
        highlights:
          - "Machine Learning Modeling & NMR Data Analysis: Conducted end-to-end machine learning modeling for metabolomic biomarker prediction in postpartum weight retention (PWR) using NMR data, with algorithms including Logistic Regression, Gaussian and Bernoulli Naive Bayes, SVM, Random Forest, KNN, XGBoost, Decision Tree, and MLP, with cross-validation and hyperparameter tuning."
          - "Evaluation Model Performance & Biological Analysis: Developed a two-layer nested cross-validation framework and biological pathway interpretation (KEGG enrichment via MetaboAnalyst) to assess model performance and interpret feature contributions."

      - company: University of Copenhagen
        position: Academic Researcher
        location: Helsingør, Denmark
        start_date: 2024-10
        end_date: 2025-03
        summary: "Supervisor: Dr. Mathias Middelboe"
        highlights:
          - "High-Performance Computing & Genomic Analysis: Large-scale WGS data processing on HPC, developing end-to-end workflows (QC/trimming with FastQC/Trimmomatic, de novo assembly via SPAdes, reference-guided scaffolding with RagTag, functional annotation using Prokka/Pharokka), and characterization of plasmids (PlasmidFinder) and virulence/resistance genes (ABRicate/ResFinder)."
          - "Comparative Genomics & Evolutionary Dynamics: Pangenome (Roary) and SNP-based phylogenetic analyses (BWA-MEM2/BCFtools/RAxML) to resolve bacteria/phage evolutionary dynamics, with structural variant detection (Mauve/Mafft)."

      - company: Technical University of Denmark & University of Copenhagen
        position: Student Researcher
        location: Copenhagen, Denmark
        start_date: 2024-09
        end_date: 2025-01
        summary: "Supervisor: Dr. Lars Rønn Olsen"
        highlights:
          - "Immunological Data Analysis & Modeling: Analyzed immunological datasets in R, applying statistical and machine learning techniques including LASSO regression, Random Forest, and Neural Networks to model CD8 mobilization and protein expression in post-exercise responses."
          - "Protein Expression Profiling: Differential expression and enrichment analyses using Limma and Gene Set Enrichment Analysis (GSEA) to identify key protein pathways and variables influencing immune responses."

      - company: Technical University of Denmark & Danish Cancer Institute
        position: Student Researcher
        location: Copenhagen, Denmark
        start_date: 2024-03
        end_date: 2024-09
        summary: "Supervisor: Dr. Elena Papaleo"
        highlights:
          - "Driver Gene Prediction in Basal-like Breast Cancer: Differential expression analysis to identify differentially expressed genes, integrated mutation data and mechanistic indicators in Moonlight2R for driver gene discovery."
          - "Programming in R for Bioconductor Packages: Developed and integrated new analysis scripts into the Moonlight2R pipeline."

      - company: McGill University
